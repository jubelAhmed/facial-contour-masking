[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "facial-contour-masking-api"
version = "1.0.0"
description = "A modern, enterprise-grade FastAPI application for processing facial images and generating SVG contour masks"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Jubel Ahmed", email = "jubel8180@gmail.com"}
]
maintainers = [
    {name = "Jubel Ahmed", email = "jubel8180@gmail.com"}
]
keywords = [
    "fastapi",
    "facial-processing",
    "computer-vision",
    "opencv",
    "svg-generation",
    "jwt-authentication",
    "rate-limiting",
    "prometheus",
    "postgresql",
    "redis"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "redis>=5.0.0",
    "prometheus-client>=0.22.0",
    "opencv-python>=4.11.0",
    "numpy>=2.3.0",
    "svgwrite>=1.4.0",
    "rich>=14.0.0",
    "python-dotenv>=1.1.0",
    "email-validator>=2.2.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "faker>=22.0.0",
    "bandit>=1.7.0",
    "safety>=3.0.0",
]
prod = [
    "gunicorn>=23.0.0",
    "psycopg2-binary>=2.9.0",
]
monitoring = [
    "sentry-sdk>=2.38.0",
    "structlog>=24.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/facial-contour-masking-api"
Documentation = "https://github.com/yourusername/facial-contour-masking-api#readme"
Repository = "https://github.com/yourusername/facial-contour-masking-api.git"
Issues = "https://github.com/yourusername/facial-contour-masking-api/issues"

[project.scripts]
facial-api = "src.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/alembic",
    "/docker",
    "/templates",
    "/requirements",
    "README.md",
    "pyproject.toml",
    "Dockerfile",
    "docker-compose.yml",
    ".env.sample",
]


[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
warn_no_return = false
warn_unreachable = false
strict_equality = false

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "opencv.*",
    "redis.*",
    "slowapi.*",
    "prometheus_client.*",
    "svgwrite.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit
    "BLE", # flake8-blind-except
    "COM", # flake8-commas
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "EM",  # flake8-errmsg
    "EXE", # flake8-executable
    "FA",  # flake8-future-annotations
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SLOT", # flake8-slots
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "INT", # flake8-gettext
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PD",  # pandas-vet
    "PGH", # pygrep-hooks
    "PL",  # pylint
    "TRY", # tryceratops
    "FLY", # flynt
    "NPY", # numpy
    "AIR", # airflow
    "PERF", # perflint
    "FURB", # refurb
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "S101",  # use of assert (common in tests)
    "PLR0913", # too many arguments
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLR2004", # magic value used in comparison
    "TRY003", # avoid specifying long messages outside the exception class
    "EM101", # raw string in exception
    "EM102", # f-string in exception
    "FBT",  # flake8-boolean-trap (too strict for now)
    "A",    # flake8-builtins (too strict for now)
    "DJ",   # flake8-django (not relevant)
    "FBT001", # boolean-type-hint-positional-argument
    "FBT002", # boolean-default-value-positional-argument
    "FBT003", # boolean-positional-value-in-call
    "PLC0415", # import-outside-top-level
    "RET504", # unnecessary-assign
    "RET505", # superfluous-else-return
    "B017",  # assert-raises-exception
    "PT028", # pytest-parameter-with-default-argument
    "RUF022", # unsorted-dunder-all
    "T201",  # print
    "B007",  # unused-loop-control-variable
    "DTZ006", # call-datetime-fromtimestamp
    "E402",  # module-import-not-at-top-of-file
    "F821",  # undefined-name
    "S106",  # hardcoded-password-func-arg
    "S105",  # hardcoded-password-string
    "DTZ003", # call-datetime-utcnow
    "DTZ005", # call-datetime-now-without-tzinfo
    "G004",  # logging-f-string
    "RSE102", # unnecessary-paren-on-raise-exception
    "RUF010", # explicit-f-string-type-conversion
    "F541",  # f-string-missing-placeholders
    "I001",  # unsorted-imports
    "N806",  # non-lowercase-variable-in-function
    "W292",  # missing-newline-at-end-of-file
    "W293",  # blank-line-with-whitespace
    "ERA001", # commented-out-code
    "COM812", # missing-trailing-comma
    "F401",  # unused-import
    "BLE001", # blind-except
    "UP045", # non-pep604-annotation-optional
    "UP006", # non-pep585-annotation
    "TRY300", # try-consider-else
    "UP035", # deprecated-import
    "B904",  # raise-without-from-inside-except
    "Q000",  # bad-quotes-inline-string
    "PIE790", # unnecessary-placeholder
    "RUF059", # unused-unpacked-variable
    "ARG001", # unused-function-argument
    "TRY301", # raise-within-try
    "F841",  # unused-variable
    "RUF013", # implicit-optional
    "PT011", # pytest-raises-too-broad
    "ARG002", # unused-method-argument
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101", "PLR2004", "TRY003", "EM101", "EM102"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = ["fastapi", "pydantic", "sqlalchemy", "uvicorn", "pytest"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = [
    "ruff>=0.14.2",
]
